spring.application.name=stdfitnessappserver
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/stdfitness
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT settings for Bearer authentication.
app.jwt.secret=stdfitnessappserver-super-secret-key-2026-change-me
app.jwt.expiration-seconds=3600
